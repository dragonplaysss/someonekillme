<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shorekeeper</title>

    <style>
        :root {
            --bg: #0b0f14;
            --card: #111821;
            --border: #202b38;
            --text: #e8edf3;
            --muted: #9aa7b5;
            --accent: #78b7ff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: var(--bg);
            color: var(--text);

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        .container {
            width: min(700px, calc(100% - 32px));
            text-align: center;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 45px 35px;
        }

        /* Shorekeeper Logo */
        .logo {
            width: 150px;
            height: 150px;

            margin: 0 auto 18px;

            border-radius: 28px;
            overflow: hidden;

            border: 1px solid var(--border);

            background: #0d141d;

            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.35);
        }

        .logo img {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;
        }

        h1 {
            margin: 0;
            font-size: 42px;
        }

        .tagline {
            color: var(--muted);
            margin: 12px 0 30px;
            font-size: 16px;
        }

        .description {
            color: #c9d2dc;
            line-height: 1.7;
            max-width: 560px;
            margin: 0 auto 30px;
        }

        .links {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .button {
            display: inline-block;
            padding: 12px 20px;

            border-radius: 9px;
            border: 1px solid var(--border);

            color: var(--text);
            text-decoration: none;

            transition: 0.2s ease;
        }

        .button:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-1px);
        }

        .primary {
            background: var(--accent);
            color: #071019;
            border-color: var(--accent);
            font-weight: 600;
        }

        .primary:hover {
            color: #071019;
            opacity: 0.9;
        }

        footer {
            margin-top: 25px;
            color: var(--muted);
            font-size: 13px;
        }

        /* Mobile */
        @media (max-width: 600px) {
            .card {
                padding: 35px 22px;
            }

            .logo {
                width: 125px;
                height: 125px;
            }

            h1 {
                font-size: 34px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <!-- Shorekeeper Logo -->
        <div class="logo">
            <img src="shorekeeper.png" alt="Shorekeeper">
        </div>

        <h1>Shorekeeper</h1>

        <p class="tagline">
            Discord moderation, security and utility.
        </p>

        <p class="description">
            Shorekeeper is a privately operated Discord application
            providing moderation, security, automation, Roblox utilities,
            and other server-management functionality.
        </p>

        <div class="links">

            <a class="button primary" href="Terms And Conditions.html">
                Terms of Service
            </a>

            <a class="button" href="Privacy Policy.html">
                Privacy Policy
            </a>

        </div>

    </div>

    <footer>
        Shorekeeper • Privately Operated
    </footer>

</div>

</body>
</html>
